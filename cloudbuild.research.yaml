steps:
  - id: test-build-and-shellcheck
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test -f src/toss_trading/runtime/rate_limit.py
        apt-get update
        apt-get install --yes --no-install-recommends shellcheck
        python -m pip install --requirement requirements-dev.lock
        python -m pip install --no-deps --editable .
        python -m pytest -q
        python scripts/check_toss_openapi.py
        python -m toss_trading.cli.research_validate_instruments
        python -m build --wheel
        shellcheck \
          scripts/load_gcp_secrets.sh \
          scripts/run_research_automation_gcp.sh \
          scripts/provision_research_automation_gcp.sh \
          scripts/install_research_automation_vm.sh \
          scripts/prune_research_runtime.sh
  - id: upload-wheel
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - RESEARCH_ARTIFACT_BUCKET=${_RESEARCH_ARTIFACT_BUCKET}
    args:
      - -ceu
      - |
        set -- dist/*.whl
        test "$$#" -eq 1
        test -n "$${RESEARCH_ARTIFACT_BUCKET}"
        python3 scripts/check_research_operations_destination.py --bucket="$${RESEARCH_ARTIFACT_BUCKET}" --verify-bucket-project
        wheel_path="$$1"
        wheel_name="$$(basename "$${wheel_path}")"
        access_token="$$(gcloud auth print-access-token)"
        curl \
          --fail-with-body \
          --silent \
          --show-error \
          --request POST \
          --header "Authorization: Bearer $${access_token}" \
          --header "Content-Type: application/octet-stream" \
          --data-binary "@$${wheel_path}" \
          "https://storage.googleapis.com/upload/storage/v1/b/$${RESEARCH_ARTIFACT_BUCKET}/o?uploadType=media&name=builds%2F${BUILD_ID}%2F$${wheel_name}"
serviceAccount: projects/toss-trading-core-lab-508411/serviceAccounts/toss-research-build@toss-trading-core-lab-508411.iam.gserviceaccount.com
substitutions:
  _RESEARCH_ARTIFACT_BUCKET: ""
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
