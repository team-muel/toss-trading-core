[project]
name = "toss-trading"
version = "0.2.0"
description = "Point-in-time trading research and modular asset-management system using Toss Invest Open API"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-secret-manager>=2.20,<3",
  "lark>=1.2,<2",
  "pyyaml>=6.0,<7",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
toss-foundation-snapshot = "toss_trading.cli.foundation_snapshot:main"
toss-foundation-audit = "toss_trading.cli.foundation_audit:main"
toss-foundation-replay = "toss_trading.cli.foundation_replay:main"
toss-research-ingest-bars = "toss_trading.cli.research_ingest_bars:main"
toss-research-backtest = "toss_trading.cli.research_backtest:main"
toss-research-collect-toss = "toss_trading.cli.research_collect_toss:main"
toss-research-collect-toss-reference = "toss_trading.cli.research_collect_toss_reference:main"
toss-research-collect-tiingo = "toss_trading.cli.research_collect_tiingo:main"
toss-research-collect-sec = "toss_trading.cli.research_collect_sec:main"
toss-research-collect-fred = "toss_trading.cli.research_collect_fred:main"
toss-research-export-cost-model = "toss_trading.cli.research_export_cost_model:main"
toss-research-validate-bars = "toss_trading.cli.research_validate_bars:main"
toss-research-validate-instruments = "toss_trading.cli.research_validate_instruments:main"
toss-research-automation = "toss_trading.cli.research_automation:main"
toss-research-reporting = "toss_trading.cli.research_reporting:main"
toss-research-plan-hypotheses = "toss_trading.cli.research_plan_hypotheses:main"
toss-research-evaluate-hypotheses = "toss_trading.cli.research_evaluate_hypotheses:main"
toss-paper-operation = "toss_trading.cli.paper_operation:main"
toss-research-recommend-stocks = "toss_trading.cli.research_recommend_stocks:main"
toss-research-collect-massive = "toss_trading.cli.research_collect_massive:main"
toss-research-validate-focus-dossier = "toss_trading.cli.research_validate_focus_dossier:main"

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "jsonschema>=4.23,<5",
  "setuptools>=69,<81",
  "shellcheck-py>=0.10,<0.11",
]
research = [
  "duckdb>=1.4,<2",
]

[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alpha_management = ["fast_expression.lark"]

[tool.setuptools.data-files]
"share/toss-trading/schemas" = ["schemas/trading_ledger.sql", "schemas/asset_management.sql", "schemas/dataset_manifest.schema.json", "schemas/quality_report.schema.json", "schemas/feature_definition.schema.json", "schemas/feature_snapshot.schema.json", "schemas/signal_definition.schema.json", "schemas/signal_snapshot.schema.json", "schemas/signal_diagnostics.schema.json", "schemas/signal_neutralization.schema.json", "schemas/signal_forecast_calibration.schema.json", "schemas/forecast_combination.schema.json", "schemas/strategy_registry.schema.json", "schemas/investor_mandate.schema.json", "schemas/quant_attribution.schema.json", "schemas/backtest_run_specification.schema.json", "schemas/decision_kernel_parity.schema.json", "schemas/signal_forecast_integrity_acceptance.schema.json", "schemas/state_snapshot.schema.json", "schemas/pricing_result.schema.json", "schemas/expected_return.schema.json", "schemas/decision_horizon.schema.json", "schemas/calculation_lineage.schema.json", "schemas/model_registry.schema.json", "schemas/risk_assessment.schema.json", "schemas/portfolio_construction.schema.json", "schemas/portfolio_transition.schema.json", "schemas/manual_override.schema.json", "schemas/decision_economic_journal.schema.json", "schemas/decision_outcome.schema.json", "schemas/risk_governor_decision.schema.json", "schemas/portfolio_accounting_result.schema.json", "schemas/account_truth_acceptance.schema.json", "schemas/temporal_truth_acceptance.schema.json", "schemas/data_truth_acceptance.schema.json", "schemas/feature_state_model_integrity_acceptance.schema.json"]
