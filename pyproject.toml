[project]
name = "toss-trading"
version = "0.2.0"
description = "Modular-monolith asset management system using Toss Invest Open API"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-secret-manager>=2.20,<3",
  "pyyaml>=6.0,<7",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
toss-foundation-snapshot = "toss_trading.cli.foundation_snapshot:main"
toss-foundation-audit = "toss_trading.cli.foundation_audit:main"
toss-foundation-replay = "toss_trading.cli.foundation_replay:main"

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "setuptools>=69,<81",
  "shellcheck-py>=0.10,<0.11",
]

[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/toss-trading/schemas" = ["schemas/trading_ledger.sql", "schemas/asset_management.sql", "schemas/dataset_manifest.schema.json", "schemas/quality_report.schema.json", "schemas/feature_definition.schema.json", "schemas/feature_snapshot.schema.json", "schemas/state_snapshot.schema.json", "schemas/pricing_result.schema.json", "schemas/expected_return.schema.json", "schemas/decision_horizon.schema.json", "schemas/calculation_lineage.schema.json", "schemas/risk_assessment.schema.json", "schemas/portfolio_construction.schema.json", "schemas/risk_governor_decision.schema.json", "schemas/portfolio_accounting_result.schema.json", "schemas/account_truth_acceptance.schema.json", "schemas/temporal_truth_acceptance.schema.json", "schemas/data_truth_acceptance.schema.json"]
"share/toss-trading/schemas/migrations" = ["schemas/migrations/0002_toss_read_only.sql", "schemas/migrations/0003_integrity_hardening.sql", "schemas/migrations/0004_order_state_execution_ledger.sql", "schemas/migrations/0005_cash_position_settlement.sql", "schemas/migrations/0006_phase3_4_ledger_hardening.sql", "schemas/migrations/0007_account_reconciliation.sql", "schemas/migrations/0008_point_in_time_observations.sql", "schemas/migrations/0009_order_reconciliation_binding.sql", "schemas/migrations/0010_persistent_pipeline_evidence.sql", "schemas/migrations/0011_account_temporal_integrity.sql", "schemas/migrations/0012_execution_settlement_evidence.sql", "schemas/migrations/0013_reference_history.sql"]
"share/toss-trading/config" = ["config/application.yaml", "config/default_policy.yaml", "config/policy_registry.yaml", "config/toss_openapi_contract.json"]
"share/toss-trading/data" = ["data/universe.csv", "data/instrument_master.csv"]
"share/toss-trading/docs" = ["docs/investment_policy.md", "docs/risk_policy.md", "docs/data_policy.md", "docs/temporal_policy.md", "docs/execution_policy.md", "docs/promotion_policy.md", "docs/account_reconciliation.md", "docs/point_in_time.md", "docs/reference_universe.md", "docs/immutable_datasets.md", "docs/implementation_phases_0_8.md", "docs/implementation_phases_0_13.md", "docs/data_collection_phase9.md", "docs/data_quality_phase10.md", "docs/feature_store_phase11.md", "docs/calculation_lineage.md", "docs/state_engines_phase12.md", "docs/asset_pricing_phase13.md", "docs/expected_returns_phase14.md", "docs/risk_models_phase15.md", "docs/portfolio_construction_phase16.md", "docs/risk_governor_phase17.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "build", "dist", "tmp"]
