[project]
name = "toss-trading"
version = "0.2.0"
description = "Toss Invest Open API account-state and market-data foundation"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-secret-manager>=2.20,<3",
  "pyyaml>=6.0,<7",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
toss-foundation-snapshot = "toss_trading.cli.foundation_snapshot:main"
toss-foundation-audit = "toss_trading.cli.foundation_audit:main"
toss-foundation-replay = "toss_trading.cli.foundation_replay:main"

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "setuptools>=69,<81",
  "shellcheck-py>=0.10,<0.11",
]

[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/toss-trading/schemas" = ["schemas/trading_ledger.sql"]
"share/toss-trading/config" = ["config/default_policy.yaml", "config/toss_openapi_contract.json"]
"share/toss-trading/data" = ["data/universe.csv", "data/instrument_master.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "build", "dist", "tmp"]
