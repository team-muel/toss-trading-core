"share/toss-trading/docs" = ["docs/investment_policy.md", "docs/risk_policy.md", "docs/data_policy.md", "docs/temporal_policy.md", "docs/execution_policy.md", "docs/promotion_policy.md", "docs/account_reconciliation.md", "docs/point_in_time.md", "docs/reference_universe.md", "docs/immutable_datasets.md", "docs/implementation_phases_0_8.md", "docs/implementation_phases_0_13.md", "docs/data_collection_phase9.md", "docs/data_quality_phase10.md", "docs/feature_store_phase11.md", "docs/signal_registry.md", "docs/signal_predictive_diagnostics.md", "docs/signal_neutralization.md", "docs/signal_forecast_calibration.md", "docs/forecast_combination.md", "docs/strategy_registry.md", "docs/investor_mandate.md", "docs/quant_attribution.md", "docs/backtest_run_specification.md", "docs/decision_kernel_parity.md", "docs/gate_d15_signal_forecast_integrity.md", "docs/calculation_lineage.md", "docs/model_registry.md", "docs/gate_d1_feature_state_model_integrity.md", "docs/state_engines_phase12.md", "docs/asset_pricing_phase13.md", "docs/expected_returns_phase14.md", "docs/risk_models_phase15.md", "docs/portfolio_construction_phase16.md", "docs/portfolio_transition.md", "docs/manual_override_governance.md", "docs/decision_economic_journal.md", "docs/risk_governor_phase17.md", "docs/32_fast_expression_history.md", "docs/research_production_bridge.md"]
