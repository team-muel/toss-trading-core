name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --editable .
      - run: python -m pytest -q
      - run: python -m build --wheel
      - run: python -c "import toss_trading.runtime"
      - run: bash -n scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
      - run: python -m pip install shellcheck-py
      - run: shellcheck scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
