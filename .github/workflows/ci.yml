name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --editable .
      - run: python -m pytest -q
      - run: python -m build --wheel
      - run: python -c "import toss_trading.runtime"
      - run: bash -n scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
      - run: python -m pip install shellcheck-py
      - run: shellcheck scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
