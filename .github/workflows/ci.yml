name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m build --wheel
      - run: python -c "import toss_trading.runtime"
      - run: bash -n scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
      - run: python -m pip install shellcheck-py
      - run: shellcheck scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
