name: ci

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "17 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --editable .
      - run: python -m pytest -q
      - run: python scripts/check_governance.py
      - run: python scripts/check_toss_openapi.py
      - run: python -m build --wheel
      - run: bash -n scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
      - run: shellcheck scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
      - name: Verify wheel resources outside checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "${smoke_dir}"
          python -c "from toss_trading.account import AccountLedger; from toss_trading.data import load_universe; from toss_trading.policy import load_policy; ledger=AccountLedger(); ledger.init_schema(); assert load_universe('data/universe.csv'); assert load_policy('config/default_policy.yaml')[0]; ledger.close()"
          python -c "from datetime import datetime, timezone; from pathlib import Path; import sqlite3, sys; from asset_management.orchestration.runtime import ApplicationRuntime; from asset_management.time.clock import FrozenClock; root=Path(sys.prefix)/'share/toss-trading'; runtime=ApplicationRuntime.boot(config_path=root/'config/application.yaml', policy_registry_path=root/'config/policy_registry.yaml', schema_root=root/'schemas', conn=sqlite3.connect(':memory:'), clock=FrozenClock(datetime(2026,9,4,1,tzinfo=timezone.utc))); assert runtime.migration_versions == (1,2,3,4)"
