name: ama161-audit-export
on:
  push:
    branches: [audit/ama161-source-197a7ae]
    paths: [.github/workflows/ama161_audit_export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: a2a7f2b5e0b6ce817c97f56e9f8a5a26a8fc24a1
          persist-credentials: false
      - name: Export only tracked cleanup source
        run: |
          mkdir -p "${RUNNER_TEMP}/audit"
          git archive --format=tar HEAD > "${RUNNER_TEMP}/audit/source-a2a7f2b.tar"
          cd "${RUNNER_TEMP}/audit"
          sha256sum source-a2a7f2b.tar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ama167-cleanup-a2a7f2b
          path: ${{ runner.temp }}/audit
          retention-days: 1
          if-no-files-found: error
