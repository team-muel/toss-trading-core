name: ama161-audit-export
on:
  push:
    branches: [audit/ama161-source-197a7ae]
    paths: [.github/workflows/ama161_audit_export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 197a7ae8d9e6e4629b43cfbba4def31ed1a59872
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Export only tracked source and public pinned dependencies
        run: |
          mkdir -p "${RUNNER_TEMP}/audit/wheels"
          git archive --format=tar HEAD > "${RUNNER_TEMP}/audit/source.tar"
          python -m pip download --only-binary=:all: -r requirements-dev.lock -d "${RUNNER_TEMP}/audit/wheels"
          cd "${RUNNER_TEMP}/audit"
          sha256sum source.tar wheels/* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ama161-audit-197a7ae
          path: ${{ runner.temp }}/audit
          retention-days: 1
          if-no-files-found: error
