name: pr79-convergence-source-objects
on:
  push:
    branches: [audit/pr79-convergence-publication]
    paths: [.github/workflows/pr79_convergence_source_objects.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: a2a7f2b5e0b6ce817c97f56e9f8a5a26a8fc24a1
          path: source
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 79d893f01e0b0eb82538996e9fe24506f3e0c00c
          path: research
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 111c900eb83dead75a41699a737f332668cf69ac
          path: quant
          persist-credentials: false
      - name: Verify locally tested source identity
        run: python transport/audit/pr79-convergence/publish_source_objects.py source research quant transport/audit/pr79-convergence
      - name: Publish non-workflow source objects within token permissions
        working-directory: source
        run: |
          set -eu
          test "$(git write-tree)" = ffac359f613c092ff7208ad5c9b145c432986ac5
          # The Actions token cannot publish workflow changes. Leave CI at the
          # original parent version; the authorized connector handles that file.
          git restore --source=HEAD --staged --worktree .github/workflows/ci.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          test "$(git write-tree)" = b4f5a2d44d7f211dafbce61349fdde891fa511df
          git config user.name "Verified source object staging"
          git config user.email "object-staging@users.noreply.github.com"
          git commit -m "Stage verified non-workflow PR79 convergence source"
          git push origin HEAD:refs/heads/audit/objects-b4f5a2d44d7f211dafbce61349fdde891fa511df
