name: ama161-publish-objects
on:
  push:
    branches: [audit/ama161-object-publication]
    paths: [audit/change.patch]
permissions:
  contents: write
jobs:
  publish-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: transport
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 79d893f01e0b0eb82538996e9fe24506f3e0c00c
          path: source
      - name: Verify patch and stage exact tested tree on audit ref only
        working-directory: source
        env:
          PATCH_SHA256: c19361df5ab2f47ca0b9a211032737c66ba5cfca4be22a3bdf2b1e9b7eaf7ca2
          EXPECTED_TREE: c1f6bb46e9d13a178f1890b1b23ea6df71860b11
        run: |
          set -eu
          patch="${GITHUB_WORKSPACE}/transport/audit/change.patch"
          echo "${PATCH_SHA256}  ${patch}" | sha256sum -c -
          git apply --check "$patch"
          git apply --index "$patch"
          git diff --cached --check
          actual="$(git write-tree)"
          test "$actual" = "$EXPECTED_TREE"
          git config user.name "Source object staging"
          git config user.email "object-staging@users.noreply.github.com"
          git commit -m "Stage verified source objects ${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/audit/objects-${EXPECTED_TREE}"
          echo "VERIFIED_TREE=$actual"
