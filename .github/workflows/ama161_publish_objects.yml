name: ama161-publish-objects
on:
  push:
    branches: [audit/ama161-object-publication]
    paths: [audit/final-p1.patch, .github/workflows/ama161_publish_objects.yml]
permissions:
  contents: write
jobs:
  publish-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: transport
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 79d893f01e0b0eb82538996e9fe24506f3e0c00c
          path: source
      - name: Verify complete tested tree and stage on audit ref only
        working-directory: source
        env:
          EXPECTED_TREE: bba36025d58e686eeb8b30ff5cbaafdd98f7ff5b4
        run: |
          set -eu
          patch="${GITHUB_WORKSPACE}/transport/audit/final-p1.patch"
          git apply --unidiff-zero --check "$patch"
          git apply --unidiff-zero --index "$patch"
          git diff --cached --check
          actual="$(git write-tree)"
          echo "ACTUAL_TREE=$actual"
          test "$actual" = "$EXPECTED_TREE"
          git config user.name "Source object staging"
          git config user.email "object-staging@users.noreply.github.com"
          git commit -m "Stage verified source objects ${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/audit/objects-${EXPECTED_TREE}"
          echo "VERIFIED_TREE=$actual"
