displayName: Toss Foundation backup upload heartbeat missing
combiner: OR
enabled: true
notificationChannels:
  - __NOTIFICATION_CHANNEL__
alertStrategy:
  autoClose: 604800s
conditions:
  - displayName: No successful backup upload event for eight hours
    conditionAbsent:
      filter: metric.type="logging.googleapis.com/user/foundation_runner_backup_upload_ok_count" AND resource.type="gce_instance" AND resource.labels.instance_id="__INSTANCE_ID__"
      duration: 28800s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_SUM
          crossSeriesReducer: REDUCE_SUM
      trigger:
        count: 1
