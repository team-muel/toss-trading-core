displayName: Toss Research daily heartbeat missing
combiner: OR
enabled: true
notificationChannels:
  - __NOTIFICATION_CHANNEL__
alertStrategy:
  autoClose: 604800s
conditions:
  - displayName: No successful research automation event for twenty-three hours
    conditionAbsent:
      filter: metric.type="logging.googleapis.com/user/research_automation_ok_count" AND resource.type="gce_instance" AND resource.labels.instance_id="__INSTANCE_ID__"
      duration: 82800s
      aggregations:
        - alignmentPeriod: 900s
          perSeriesAligner: ALIGN_SUM
          crossSeriesReducer: REDUCE_SUM
      trigger:
        count: 1
