displayName: Toss Research hypothesis evaluation failed
combiner: OR
enabled: true
notificationChannels:
  - __NOTIFICATION_CHANNEL__
alertStrategy:
  autoClose: 604800s
conditions:
  - displayName: Research hypothesis evaluation failure event
    conditionThreshold:
      filter: metric.type="logging.googleapis.com/user/research_hypothesis_evaluation_failed_count" AND resource.type="gce_instance" AND resource.labels.instance_id="__INSTANCE_ID__"
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 0s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_SUM
          crossSeriesReducer: REDUCE_SUM
      trigger:
        count: 1
