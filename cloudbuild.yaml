steps:
  - name: python:3.12-slim
    id: test-build-and-shellcheck
    entrypoint: bash
    args:
      - -ceu
      - |
        test -f src/toss_trading/broker/toss.py
        apt-get update
        apt-get install --yes --no-install-recommends shellcheck
        python -m pip install --requirement requirements-dev.lock
        python -m pip install --no-deps --editable .
        python -m pytest -q
        python scripts/check_toss_openapi.py
        python -m build --wheel
        shellcheck scripts/load_gcp_secrets.sh scripts/run_foundation_gcp.sh
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
