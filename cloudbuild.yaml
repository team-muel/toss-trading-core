steps:
  - name: python:3.12-slim
    id: test-build-and-shellcheck
    entrypoint: bash
    args:
      - -ceu
      - |
        test -f src/toss_trading/runtime/rate_limit.py
        apt-get update
        apt-get install --yes --no-install-recommends shellcheck
        python -m pip install --requirement requirements-dev.lock
        python -m pip install --no-deps --editable .
        python -m pytest -q
        python -m build --wheel
        shellcheck \
          scripts/load_gcp_secrets.sh \
          scripts/run_foundation_gcp.sh \
          scripts/run_research_automation_gcp.sh \
          scripts/provision_research_automation_gcp.sh \
          scripts/install_research_automation_vm.sh
artifacts:
  objects:
    location: gs://toss-trading-core-lab-research-data/builds/$BUILD_ID/
    paths:
      - dist/*.whl
serviceAccount: projects/toss-trading-core-lab/serviceAccounts/toss-research-build@toss-trading-core-lab.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
