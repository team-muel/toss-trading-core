runtime:
  mode: foundation_read_only
  base_currency: USD
  tax_reporting_currency: KRW
  live_trading_enabled: false
  broker_base_url: https://openapi.tossinvest.com
  toss_openapi_schema_version: 1.2.14
  toss_openapi_schema_hash: a7b32ba754401d13fa649ba91eebd212420eb1afab28e9c2c0d6ea8d43055fed
  toss_openapi_schema_hash_source: https://openapi.tossinvest.com/openapi-docs/latest/openapi.json
  toss_openapi_contract_review: config/toss_openapi_contract.json
  closed_order_listing_supported: true
  closed_order_lookback_days: 7
  broker_capabilities:
    standard_order_entry:
      documented: true
      enabled: false
    conditional_order_entry:
      documented: true
      enabled: false
      supported_contract_types:
        - SINGLE
        - OCO
        - OTO
    conditional_order_modify:
      documented: true
      enabled: false
    disabled_reason: "This Foundation adapter is read-only."

starter_guardrails:
  max_open_orders: 1
  block_new_orders_on_any_reconciliation_diff: true
  block_new_orders_after_any_unknown_order_state: true
  require_same_run_reconciliation: true
  require_normal_source_health: true
  require_rate_limit_healthy: true

rate_limit:
  design_doc: docs/11_rate_limit_token_bucket.md
  use_token_bucket_per_api_group: true
  prioritize_order_state_over_new_orders: true
