runtime:
  mode: paper
  base_currency: USD
  tax_reporting_currency: KRW
  live_trading_enabled: false
  broker_base_url: https://openapi.tossinvest.com
  toss_openapi_schema_hash: 3cfe843cba752874ab4fa83998e2614c8c03fb7bc154ee53e65df8e078a1d71d
  toss_openapi_schema_hash_source: https://openapi.tossinvest.com/openapi-docs/latest/openapi.json
  live_scope: equity_etf_only

external_data:
  execution_truth_source: toss
  provider_data_never_overwrites_broker_state: true
  minimum_stack:
    massive_rest:
      enabled: false
      role:
        - options_snapshot_research
        - dividends_splits
        - indices_futures_proxy
    fred:
      enabled: false
      role:
        - rate_hurdle
        - treasury_yield_series
        - release_calendar
    sec_edgar:
      enabled: false
      role:
        - official_event_gate
        - ticker_cik_map
        - filing_classifier
    issuer_parser:
      enabled: false
      role:
        - etf_nav
        - premium_discount
        - roc_tax_character_audit
  stage2_optional:
    massive_websocket:
      enabled: false
      requires_source_health: true
    tradier:
      enabled: false
      role:
        - options_chain_backup
        - etb_list
  source_health_required_before_signal: true

calibration:
  policy_values_are_market_laws: false
  report_numbers_are_initial_guardrails_only: true
  requires_paper_trade_calibration_before_live: true
  require_manual_approval_for_threshold_changes: true
  minimum_observations_before_relaxing_limits: null
  calibration_inputs:
    - realized_slippage
    - reject_rate
    - partial_fill_rate
    - order_latency
    - drawdown_distribution
    - symbol_liquidity
    - tax_and_fee_drag
    - source_stale_rate
    - fallback_rate
    - nav_roc_manual_audit_rate

starter_guardrails:
  description: "More conservative than report examples; use only for paper/micro-live until calibrated."
  max_drawdown_warning_pct: 1.0
  max_drawdown_kill_switch_pct: 2.0
  single_trade_max_loss_nav_pct: 0.1
  single_live_order_notional_nav_pct: 0.1
  max_open_orders: 1
  allow_amount_based_market_orders: false
  allow_high_value_order_confirmation: false
  allow_stale_external_signal_reuse: false
  block_new_orders_on_any_reconciliation_diff: true
  block_new_orders_after_any_unknown_order_state: true

portfolio_limits:
  # Populated only after calibration review. Do not copy report numbers here.
  max_drawdown_warning_pct: null
  max_drawdown_kill_switch_pct: null
  single_trade_max_loss_nav_pct: null
  single_live_order_notional_nav_pct: null
  distribution_etf_single_name_cap_nav_pct: null
  distribution_etf_engine_cap_nav_pct: null

option_carry:
  enabled: false
  live_orders_enabled: false
  disabled_reason: "Toss Open API docs do not provide options chain, Greeks, or options order endpoints."
  calibration_required: true

etf_relative_value:
  enabled: true
  live_orders_enabled: false
  calibration_required: true
  lookback_days: null
  half_life_bounds_days: null
  exit_zscore_abs: null
  max_holding_days: null
  gross_exposure_bounds_nav_pct: null
  require_borrow_rate_for_short_leg: true
  live_scope_note: "Toss live MVP allows long-only cash/ETF switching until borrow and short mechanics are verified elsewhere."

distribution_filter:
  enabled: true
  calibration_required: true
  block_dividend_capture_before_ex_date: true
  nav_premium_warning_pct: null
  reduce_weight_when_roc_unknown: true

tbill_collateral:
  enabled: true
  live_orders_enabled: false
  mode: accounting_only
  disabled_reason: "Toss Open API holdings exclude overseas bonds; T-bill collateral automation is out of official scope."
  calibration_required: true

data_quality:
  max_market_data_delay_seconds: null
  global_gates:
    block_on_stale_toss_market_data: true
    block_on_missing_broker_snapshot: true
    block_on_missing_source_health_for_external_signal: true
  engine_scoped_gates:
    distribution_filter:
      block_when_nav_stale: true
      block_when_roc_unknown: true
      block_when_issuer_parser_failed: true
    etf_relative_value:
      block_when_borrow_missing: true
      require_whitelisted_homogeneous_pair: true
    option_carry:
      block_when_option_quote_crossed: true
      block_when_option_chain_stale: true
    opening_gap_fade:
      block_when_orderbook_trade_timestamp_mismatch: true

alerts:
  order_reject_rate_kill_switch_pct: null
  slippage_model_multiple_warning: null
  slippage_warning_consecutive_days: null
  engine_pnl_corr_warning: null

rate_limit:
  design_doc: docs/11_rate_limit_token_bucket.md
  use_token_bucket_per_api_group: true
  prioritize_order_state_over_new_orders: true
