schema_version: research-data-sources-v1
reviewed_at: "2026-08-08"
scope: private_internal_research
redistribution_allowed: false

selection:
  market_bar_total_return_primary: tiingo_eod
  broker_cross_check: toss_candles
  macro_point_in_time: fred_alfred
  issuer_events_and_identifiers: sec_edgar
  options_and_corporate_actions_later: massive

providers:
  tiingo_eod:
    decision: selected_active_internal_research
    product: Starter
    price_reviewed: "$0/month"
    license: Internal Use Only
    license_acceptance_owner: user
    permitted_use:
      - private_personal_research
      - internal_backtesting
    prohibited_use:
      - redistribution
      - public_display
      - sharing_raw_or_derived_provider_data
    capabilities:
      raw_ohlcv: true
      split_adjusted_ohlcv: true
      total_return_ohlcv: true
      dividends: true
      splits: true
    reviewed_limits:
      unique_symbols_per_month: 500
      requests_per_hour: 50
      requests_per_day: 1000
      monthly_bandwidth_gb: 1
    credential_env: TIINGO_API_TOKEN
    symbol_identity:
      canonical_current: SPYM
      provider_alias: SPLG
    official_docs: https://www.tiingo.com/documentation/end-of-day
    official_pricing: https://www.tiingo.com/about/pricing

  toss_candles:
    decision: selected_bootstrap_and_cross_check
    license: provisional_internal_openapi_use
    permitted_use:
      - private_account_research
      - broker_market_data_cross_check
    prohibited_use:
      - redistribution_without_written_terms_review
      - total_return_backtest_input
    capabilities:
      raw_ohlcv: true
      adjusted_ohlcv: true
      total_return_ohlcv: false
      stock_reference: true
      stock_warnings: true
      usd_krw_reference_fx: true
      market_calendar: true
      rankings: true
      kr_market_indicators: true
      kr_investor_trading: true
    normalization_policy:
      adjusted_false: raw
      adjusted_true: split_adjusted
      adjusted_true_quality_flag: estimated
      reason: exact dividend-adjustment semantics have not been verified
    credential_env:
      - TOSS_CLIENT_ID
      - TOSS_CLIENT_SECRET
    network_control: registered_gcp_static_ip_only
    official_docs: https://developers.tossinvest.com/docs
    official_product_page: https://home.tossinvest.com/en/open-api
    automation:
      daily_recent_revision_window_days: 45
      weekly_full_reconciliation: true
      upload_requires_quality_pass: true
      raw_cross_validation:
        comparison_provider: tiingo_eod
        comparison_lookback_calendar_days: 45
        maximum_close_error_bps: 100
        volume_difference_warning_ratio: 0.20
    symbol_identity:
      canonical_current: SPYM
      provider_symbol: SPYM
      prior_ticker: SPLG

  fred_alfred:
    decision: selected_active_approved_series_only
    license: series_level_rights_and_attribution_required
    permitted_use:
      - approved_series_internal_research
      - point_in_time_macro_features
    prohibited_use:
      - web_scraping
      - assuming_all_series_are_public_domain
    capabilities:
      observations: true
      vintage_dates: true
      release_calendar: true
      point_in_time_macro_regime: true
    credential_env: FRED_API_KEY
    official_api: https://fred.stlouisfed.org/docs/api/fred/
    official_terms: https://fred.stlouisfed.org/docs/api/terms_of_use.html
    automation_gate:
      series_registry: config/fred_series.csv
      series_rights_review_required: true
      secret_required: true
    point_in_time_policy:
      publication_lag_calendar_days: 1
      weekly_full_vintage_refresh: true
      daily_revision_window_days: 90
      missing_or_discontinuous_cache_forces_full_refresh: true

  sec_edgar:
    decision: selected
    license: public_access_with_fair_access_and_document_rights_review
    permitted_use:
      - ticker_cik_mapping
      - submissions_and_filing_metadata
      - issuer_event_research
    capabilities:
      submissions_json: true
      companyfacts_json: true
      bulk_archives: true
    authentication_required: false
    user_agent_required: true
    maximum_requests_per_second: 10
    collector_requests_per_second: 8
    official_api: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    official_rate_policy: https://www.sec.gov/filergroup/announcements-old/new-rate-control-limits
    automation_gate:
      schedule: weekly
      approved_contact_user_agent_required: true

  massive:
    decision: selected_pending_user_credential_for_broad_stock_screening
    reason: grouped daily bars cover the broad US stock universe efficiently but are not the ETF baseline total-return source
    credential_env: MASSIVE_API_KEY
    recommendation_scope:
      target_common_stock_universe: 2500
      grouped_daily_adjusted_bars: true
      research_recommendations_only: true
      order_authority: false
      activation_gate: personal_terms_approval_and_secret_version_required
    future_scope:
      - options_snapshots
      - dividends
      - splits
    prohibited_use:
      - primary_total_return_backtest_bars
      - personalized_advice_claims
      - recommendation_to_live_order_promotion
    official_adjustment_policy: https://massive.com/knowledge-base/article/is-massives-stock-data-adjusted-for-splits-or-dividends
    official_dividend_policy: https://massive.com/knowledge-base/article/does-massive-adjust-historic-dividends-for-splits
